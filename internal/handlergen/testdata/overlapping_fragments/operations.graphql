# GetUser spreads two overlapping fragments on the concrete type User; the
# generator dedupes by GraphQL field name (first occurrence wins), so id, name,
# email each appear once.
#
# Search selects a union with a narrowing fragment per member, so each variant
# carries its own id with no cross-member collapse.
#
# NOTE: a field selected with conflicting types across members (e.g. Int! vs
# String!) cannot be expressed here — gqlparser's SameResponseShape rule rejects
# it before generation, so the generator never sees that case.
query GetUser($id: ID!) {
  user(id: $id) {
    ...UserCore
    ...UserContact
  }
}

fragment UserCore on User {
  id
  name
}

fragment UserContact on User {
  id
  name
  email
}

query Search($query: String!) {
  search(query: $query) {
    __typename
    ... on Player {
      id
      score
    }
    ... on Team {
      id
      rank
    }
  }
}
