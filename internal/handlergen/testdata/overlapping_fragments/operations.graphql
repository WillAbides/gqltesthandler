# Exercises overlapping/duplicate field selection and deterministic dedupe.
#
# GetUser spreads two fragments on the same concrete type (User) whose field
# sets overlap (both select id and name). The generator dedupes by GraphQL
# field name (first occurrence wins), so the flattened struct lists id, name,
# email exactly once.
#
# Search selects a union with narrowing fragments on each member, so it is
# modeled polymorphically: one variant struct per member. id is selected inside
# each member fragment, so each variant carries its own id alongside its
# distinct field (score, rank) — there is no cross-member collapse in the
# polymorphic shape.
#
# NOTE: a field selected with conflicting types across members (e.g. Int! vs
# String!) cannot be expressed here — gqlparser's SameResponseShape rule
# rejects it before generation, so the generator never sees that case.
query GetUser($id: ID!) {
  user(id: $id) {
    ...UserCore
    ...UserContact
  }
}

fragment UserCore on User {
  id
  name
}

fragment UserContact on User {
  id
  name
  email
}

query Search($query: String!) {
  search(query: $query) {
    __typename
    ... on Player {
      id
      score
    }
    ... on Team {
      id
      rank
    }
  }
}
