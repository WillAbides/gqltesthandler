# FeedItem is a union of Article | Ad; only Article implements Authored. Feed
# narrows the interface inside the union via `... on Authored`, which resolves to
# {Article} only (Ad does not implement Authored), so `author` lands on the
# Article variant and never leaks onto Ad — the headline possible-type
# intersection guarantee.
#
# FeedNoTypename selects the union with only concrete inline fragments (no
# __typename, no shared scalar), pinning that each member still becomes its own
# variant.
query Feed {
  feed {
    __typename
    ... on Authored {
      author
    }
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}

query FeedNoTypename {
  feed {
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}
