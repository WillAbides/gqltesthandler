# Exercises abstract intersections within a union.
#
# FeedItem is a union of Article | Ad. Only Article implements the Authored
# interface (partial implementation). The Feed operation narrows the interface
# inside the union via `... on Authored`, which is valid because the interface's
# possible types intersect the union's members. The generator flattens the
# interface fragment, the concrete fragments, and __typename into one struct.
#
# FeedNoTypename selects a union with no field in common except the inline
# fragments themselves (no __typename, no shared scalar), pinning that the
# flattened struct is just the union of the per-member selections.
query Feed {
  feed {
    __typename
    ... on Authored {
      author
    }
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}

query FeedNoTypename {
  feed {
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}
