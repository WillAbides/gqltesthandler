# Exercises abstract intersections within a union.
#
# FeedItem is a union of Article | Ad. Only Article implements the Authored
# interface (partial implementation). The Feed operation narrows the interface
# inside the union via `... on Authored`, which is valid because the interface's
# possible types intersect the union's members. Because the selection contains
# narrowing fragments, the generator models it polymorphically: a discriminator
# interface plus one variant struct per concrete member. `... on Authored`
# resolves to {Article} (Ad does not implement Authored), so `author` lands on
# the Article variant only and never leaks onto Ad.
#
# FeedNoTypename selects the union with only the concrete inline fragments (no
# __typename, no shared scalar), pinning that each member still becomes its own
# variant struct carrying just that member's fields.
query Feed {
  feed {
    __typename
    ... on Authored {
      author
    }
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}

query FeedNoTypename {
  feed {
    ... on Article {
      title
    }
    ... on Ad {
      sponsor
    }
  }
}
